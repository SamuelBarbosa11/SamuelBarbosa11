<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Demonstração do portfólio de Samuel Barbosa."
		/>
		<title>Portfólio | Samuel Barbosa</title>
		<style>
			:root {
				color-scheme: dark;
				--background: #0d1117;
				--panel: #161b22;
				--border: #30363d;
				--text: #f0f6fc;
				--muted: #8b949e;
				--accent: #58a6ff;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				padding: 32px 18px;
				background:
					radial-gradient(
						circle at top left,
						rgba(88, 166, 255, 0.16),
						transparent 34rem
					),
					var(--background);
				color: var(--text);
				font-family: Georgia, "Times New Roman", serif;
			}

			main {
				width: min(100%, 960px);
			}

			.eyebrow {
				margin: 0 0 10px;
				color: var(--accent);
				font-family: "Courier New", monospace;
				font-size: 0.85rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			h1 {
				margin: 0;
				font-size: clamp(2rem, 6vw, 4.5rem);
				line-height: 1;
			}

			.intro {
				max-width: 650px;
				margin: 18px 0 28px;
				color: var(--muted);
				font-size: 1.08rem;
				line-height: 1.6;
			}

			.video-frame {
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: 12px;
				background: #010409;
				box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
			}

			video {
				display: block;
				width: 100%;
				max-height: 70vh;
				background: #010409;
			}

			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				margin-top: 20px;
			}

			.button {
				display: inline-block;
				padding: 11px 17px;
				border: 1px solid var(--border);
				border-radius: 8px;
				color: var(--text);
				background: var(--panel);
				font-family: "Courier New", monospace;
				font-size: 0.9rem;
				text-decoration: none;
				transition:
					border-color 160ms ease,
					color 160ms ease,
					transform 160ms ease;
			}

			.button:hover,
			.button:focus-visible {
				border-color: var(--accent);
				color: var(--accent);
				transform: translateY(-2px);
			}

			.note {
				margin: 18px 0 0;
				color: var(--muted);
				font-size: 0.88rem;
			}

			@media (prefers-reduced-motion: reduce) {
				.button {
					transition: none;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<p class="eyebrow">Samuel Barbosa / portfólio</p>
			<h1>Uma prévia do meu trabalho.</h1>
			<p class="intro">
				Explore a demonstração do meu portfólio e conheça um pouco mais sobre
				meus projetos, experiências e forma de construir produtos digitais.
			</p>

			<div class="video-frame">
				<video autoplay muted loop controls playsinline preload="metadata">
					<source
						src="assets/video%20preview%20portifolio%20-%20Samuel%20Barbosa.mp4"
						type="video/mp4"
					/>
					Seu navegador não suporta a reprodução de vídeos.
					<a
						href="assets/video%20preview%20portifolio%20-%20Samuel%20Barbosa.mp4"
					>
						Abrir o vídeo diretamente
					</a>
				</video>
			</div>

			<div class="actions">
				<a
					class="button"
					href="https://github.com/SamuelBarbosa11/Portifolio-Samuel-Barbosa.git"
					target="_blank"
					rel="noopener noreferrer"
				>
					Saiba mais sobre o projeto
				</a>
				<a
					class="button"
					href="https://github.com/SamuelBarbosa11"
					target="_blank"
					rel="noopener noreferrer"
				>
					GitHub
				</a>
			</div>

			<p class="note">
				Reprodução automática sem áudio. Use os controles para ativar o som.
			</p>
		</main>
	</body>
</html>
